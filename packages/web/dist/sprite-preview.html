<!DOCTYPE html>
<html>
<head>
<title>Sprite Preview</title>
<style>
body { background: #1a1a2a; color: #eee; font-family: monospace; padding: 20px; }
.row { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
.label { width: 120px; font-size: 12px; color: #aaa; }
canvas { image-rendering: pixelated; border: 1px solid #444; }
h2 { color: #88aaff; margin-top: 20px; }
</style>
</head>
<body>
<h1>Generated Sprite Preview</h1>
<div id="container"></div>
<script>
const types = ['catapult', 'crossbow', 'samurai'];
const factions = ['blue', 'red', 'black', 'purple', 'yellow'];
const FACTION_DIRS = { blue:'Blue', red:'Red', black:'Black', purple:'Purple', yellow:'Yellow' };
const TYPE_DIRS = { catapult:'Catapult', crossbow:'Crossbow', samurai:'Samurai' };
const TYPE_FILES = { catapult:'Catapult_Idle.png', crossbow:'Crossbow_Idle.png', samurai:'Samurai_Idle.png' };
const root = '/tiny-swords/Tiny Swords (Free Pack)/Units/';

const container = document.getElementById('container');

for (const type of types) {
  const h2 = document.createElement('h2');
  h2.textContent = type.toUpperCase();
  container.appendChild(h2);
  for (const faction of factions) {
    const src = root + `${FACTION_DIRS[faction]} Units/${TYPE_DIRS[type]}/${TYPE_FILES[type]}`;
    const row = document.createElement('div');
    row.className = 'row';
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = faction;
    row.appendChild(label);
    const img = new Image();
    img.onload = () => {
      // Draw first frame (192x192) on canvas at 2x scale
      const canvas = document.createElement('canvas');
      canvas.width = 192; canvas.height = 192;
      canvas.style.width = '96px'; canvas.style.height = '96px';
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, 192, 192, 0, 0, 192, 192);
      row.appendChild(canvas);
      // Draw all 6 frames small
      for (let f = 0; f < 6; f++) {
        const c2 = document.createElement('canvas');
        c2.width = 192; c2.height = 192;
        c2.style.width = '48px'; c2.style.height = '48px';
        const ctx2 = c2.getContext('2d');
        ctx2.drawImage(img, f*192, 0, 192, 192, 0, 0, 192, 192);
        row.appendChild(c2);
      }
    };
    img.onerror = () => {
      const err = document.createElement('span');
      err.textContent = '❌ ' + src;
      err.style.color = '#f66';
      row.appendChild(err);
    };
    img.src = src;
    container.appendChild(row);
  }
}
</script>
</body>
</html>
